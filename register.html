<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLelite - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Criar Conta PLelite</h2>
    <form id="register-form">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" required placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label for="whatsapp">WhatsApp</label>
        <input type="text" id="whatsapp" required placeholder="(XX) XXXXX-XXXX">
      </div>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">Cadastrar</button>
    </form>
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
      Já tem uma conta? <a href="login.html" style="color: var(--gold-primary);">Fazer Login</a>
    </div>
  </div>

  <!-- Firebase CDN Modular -->
  <script type="module" src="auth.js"></script>
</body>
</html>
