<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLelite - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Acessar PLelite</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="Sua senha">
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
    </form>
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
      <a href="#" id="reset-password" style="color: var(--gold-primary);">Esqueceu sua senha?</a><br><br>
      Ainda não tem conta? <a href="register.html" style="color: var(--gold-primary);">Cadastre-se</a>
    </div>
  </div>

  <!-- Firebase CDN Modular -->
  <script type="module" src="auth.js"></script>
</body>
</html>
