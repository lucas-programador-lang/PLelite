<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesse sua conta no PLelite.">
  <title>PLelite - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <h2>Acessar PLelite</h2>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          placeholder="seu@email.com"
        >
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="password-wrapper" style="position: relative;">
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Sua senha"
            style="width: 100%; padding-right: 2.5rem;"
          >
          <button
            type="button"
            id="toggle-password"
            aria-label="Mostrar senha"
            style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 0.85rem; color: var(--gold-primary, #b08d57);"
          >Mostrar</button>
        </div>
      </div>

      <div
        id="form-message"
        role="alert"
        aria-live="polite"
        style="min-height: 1.2rem; margin-bottom: 0.75rem; font-size: 0.85rem;"
      ></div>

      <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%;">
        Entrar
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
      <a href="#" id="reset-password" style="color: var(--gold-primary);">Esqueceu sua senha?</a><br><br>
      Ainda não tem conta? <a href="register.html" style="color: var(--gold-primary);">Cadastre-se</a>
    </div>
  </div>

  <!-- Toggle de visibilidade de senha (não mexe com o Firebase) -->
  <script>
    const togglePasswordBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    togglePasswordBtn.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      togglePasswordBtn.textContent = isHidden ? 'Ocultar' : 'Mostrar';
      togglePasswordBtn.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
    });

    // Validação nativa antes de deixar o auth.js assumir o submit.
    const form = document.getElementById('login-form');
    form.addEventListener('submit', (e) => {
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopImmediatePropagation();
        form.reportValidity();
      }
    });
  </script>

  <!-- Firebase CDN Modular -->
  <script type="module" src="auth.js"></script>
</body>
</html>
