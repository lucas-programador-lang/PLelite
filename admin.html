<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLelite - Painel Administrativo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .admin-section { background: linear-gradient(160deg, #1c1a14 0%, #100e0a 100%); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 1.5rem; }
    .admin-section h3 { color: var(--gold-primary); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">PLelite — Admin</a>
    <nav id="nav-menu">
      <a href="index.html" class="btn-secondary">Ir para o site</a>
    </nav>
  </header>

  <main class="admin-container" id="admin-panel" style="display: none;">
    <h2 style="font-family: var(--font-display); background: var(--gold-gradient-text); -webkit-background-clip: text; -background-clip: text; color: transparent; margin-bottom: 1.5rem;">Painel de Controle do Administrador</h2>

    <!-- Seção 1: Atualizar Caixa Financeiro -->
    <section class="admin-section">
      <h3>Transparência de Caixa Global</h3>
      <form id="finance-form" style="display: flex; gap: 1rem; flex-wrap: wrap;">
        <div class="form-group" style="flex: 1; min-width: 200px;">
          <label>Total Pago em Patrocínios (R$)</label>
          <input type="text" id="val-patrocinios" placeholder="0.00">
        </div>
        <div class="form-group" style="flex: 1; min-width: 200px;">
          <label>Arrecadado para Sorteios (R$)</label>
          <input type="text" id="val-sorteios" placeholder="0.00">
        </div>
        <div style="align-self: flex-end; margin-bottom: 1.25rem;">
          <button type="submit" class="btn-primary">Atualizar Valores</button>
        </div>
      </form>
    </section>

    <!-- Seção 2: Aprovação de Membros VIP -->
    <section class="admin-section">
      <h3>Liberação de Usuários (Acesso VIP)</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>WhatsApp</th>
              <th>E-mail</th>
              <th>Status VIP</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <!-- Injetado via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="unauthorized-screen" style="text-align: center; padding: 5rem 1rem; display: none;">
    <h2 style="color: #e05252;">Acesso Negado</h2>
    <p style="color: var(--text-muted); margin-top: 0.5rem;">Esta área é restrita para o administrador do PLelite.</p>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const WORKER_URL = "https://api.compartilhar-projetos.com.br"; // Substitua pelo link do seu Worker se necessário

    const adminPanel = document.getElementById('admin-panel');
    const unauthorizedScreen = document.getElementById('unauthorized-screen');
    const usersTableBody = document.getElementById('users-table-body');
    const financeForm = document.getElementById('finance-form');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        unauthorizedScreen.style.display = 'block';
        return;
      }

      const snap = await get(ref(db, `users/${user.uid}/role`));
      if (snap.exists() && snap.val() === 'admin') {
        adminPanel.style.display = 'block';
        carregarUsuariosAdmin();
      } else {
        unauthorizedScreen.style.display = 'block';
      }
    });

    function carregarUsuariosAdmin() {
      const usersRef = ref(db, 'users');
      onValue(usersRef, (snapshot) => {
        const users = snapshot.val() || {};
        let html = '';

        Object.entries(users).forEach(([uid, u]) => {
          html += `
            <tr>
              <td>${u.nome || 'Sem nome'}</td>
              <td>${u.whatsapp || '—'}</td>
              <td>${u.email || '—'}</td>
              <td><span style="color: ${u.isVIP ? '#25d366' : '#a1a1aa'}">${u.isVIP ? 'Liberado (VIP)' : 'Comum'}</span></td>
              <td>
                <button onclick="toggleVip('${uid}', ${!u.isVIP})" class="btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">
                  ${u.isVIP ? 'Remover VIP' : 'Aprovar VIP'}
                </button>
              </td>
            </tr>
          `;
        });

        usersTableBody.innerHTML = html;
      });
    }

    window.toggleVip = async function(targetUserId, novaSituacao) {
      try {
        const token = await auth.currentUser.getIdToken();
        const res = await fetch(`https://SEU-WORKER.workers.dev/admin/toggle-vip`, { // Ajuste para a URL do seu worker
          method: 'POST',
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ targetUserId, isVIP: novaSituacao })
        });
        if (res.ok) alert('Status VIP atualizado com sucesso!');
        else alert('Erro ao alterar permissão.');
      } catch (err) {
        console.error(err);
        alert('Falha na comunicação com o servidor.');
      }
    }

    financeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const totalPatrocinios = document.getElementById('val-patrocinios').value;
      const totalSorteios = document.getElementById('val-sorteios').value;

      try {
        const token = await auth.currentUser.getIdToken();
        const res = await fetch(`https://SEU-WORKER.workers.dev/admin/update-finance`, {
          method: 'POST',
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ totalPatrocinios, totalSorteios })
        });
        if (res.ok) alert('Valores de caixa atualizados!');
      } catch (err) {
        alert('Erro ao atualizar caixa.');
      }
    });
  </script>
</body>
</html>
